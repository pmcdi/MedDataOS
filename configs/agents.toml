# Specialists the router can consult. `modalities` lists the kinds of file a
# specialist owns (note, structured, dicom): the router then reads those files
# through the specialist, not with its own describe or fetch.

[notes]
url = "http://127.0.0.1:8002/v1"
description = "Answers from clinical notes with verified quotes, dates, and conflicts. Use this for questions about the chart, history, labs in notes, and discrepancies between notes."
modalities = ["note"]

# The stand-in looks at one slice and cannot measure. It owns no modality, so
# the router can still fetch series metadata and volumes itself.
[imaging]
url = "http://127.0.0.1:8003/v1"
description = "Looks at one DICOM slice. Use this for questions about the images, scans, contours, or what is visible on imaging."

[tabular]
url = "http://127.0.0.1:8004/v1"
description = "Answers from the case's tables: lab results, vitals, medications, encounters, treatment logs, and registry rows. Use this for a value on a date, a trend, a lowest or highest value, a change over a period, and scores (Child-Pugh, ALBI, MELD, FIB-4, BMI, days between dates). Every number is computed by code from the table."
modalities = ["structured"]
